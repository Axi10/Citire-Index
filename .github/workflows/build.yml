name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        cache-disabled: true

    - name: Prepare signing key and environment
      env:
        DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
      run: |
        touch .env
        if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
          # Stable key from the repository secret: every APK is signed the same way, so a new
          # APK installs over the old one and keeps the app data. The key may have been exported
          # on Windows, where Java sees it under another alias: re-import it as androiddebugkey.
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > debug-imported.p12
          if SRC_ALIAS=$(keytool -list -keystore debug-imported.p12 -storetype PKCS12 -storepass android | grep -m1 PrivateKeyEntry | cut -d, -f1) && [ -n "$SRC_ALIAS" ] && keytool -importkeystore -noprompt \
              -srckeystore debug-imported.p12 -srcstoretype PKCS12 -srcstorepass android -srcalias "$SRC_ALIAS" \
              -destkeystore debug.keystore -deststoretype PKCS12 -deststorepass android \
              -destalias androiddebugkey -destkeypass android; then
            echo "Using the signing key from the DEBUG_KEYSTORE_BASE64 secret"
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 could not be read; using a temporary key (the APK will not install over the previous one)"
            rm -f debug.keystore
          fi
          rm -f debug-imported.p12
        else
          echo "::warning::No DEBUG_KEYSTORE_BASE64 secret; using a temporary key (the APK will not install over the previous one)"
        fi
        if [ ! -f debug.keystore ]; then
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Accept Android SDK licenses
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || yes | sdkmanager --licenses || true

    - name: Build APK with Gradle
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: index-utilitati-apk
        path: app/build/outputs/apk/debug/*.apk

    - name: Static analysis (Android lint)
      run: |
        ./gradlew lintDebug --no-daemon || true
        cat app/build/reports/lint-results-debug.txt || echo "No lint text report found"
