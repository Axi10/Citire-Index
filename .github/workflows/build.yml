name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        cache-disabled: true

    - name: Restore debug keystore and environment
      run: |
        touch .env
        if [ -f debug.keystore.base64 ]; then
          # The stored keystore was exported on Windows: Java sees its key under another alias.
          # Re-import it under the alias Gradle expects (androiddebugkey).
          base64 -d debug.keystore.base64 > debug-imported.p12
          SRC_ALIAS=$(keytool -list -keystore debug-imported.p12 -storetype PKCS12 -storepass android | grep -m1 PrivateKeyEntry | cut -d, -f1)
          echo "Key alias in stored keystore: $SRC_ALIAS"
          keytool -importkeystore -noprompt \
            -srckeystore debug-imported.p12 -srcstoretype PKCS12 -srcstorepass android -srcalias "$SRC_ALIAS" \
            -destkeystore debug.keystore -deststoretype PKCS12 -deststorepass android \
            -destalias androiddebugkey -destkeypass android
        fi
        if [ ! -f debug.keystore ]; then
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Accept Android SDK licenses
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || yes | sdkmanager --licenses || true

    - name: Build APK with Gradle
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: index-utilitati-apk
        path: app/build/outputs/apk/debug/*.apk
